<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tuinwijzer – water geven en snoeien op het juiste moment</title>
    <meta name="description" content="Wateradvies op basis van het weer en een persoonlijke snoeikalender voor je tuin." />
  </head>
  <body>
    <div id="root"></div>
    <!-- Voor Netlify Forms: zo herkent Netlify het formulier bij de build. Het echte formulier staat in de app. -->
    <form name="plant-suggestie" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="plant" />
      <textarea name="toelichting"></textarea>
      <input name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

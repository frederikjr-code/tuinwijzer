<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tuinwijzer – snoeikalender en wateradvies voor je tuin</title>
    <meta name="description" content="Maak gratis je eigen snoeikalender: kies je planten en zie per maand wat je snoeit. Plus wateradvies op basis van het weer in jouw woonplaats." />
    <link rel="canonical" href="https://tuinwijzer.netlify.app/" />
    <meta property="og:title" content="Tuinwijzer – snoeikalender en wateradvies voor je tuin" />

    <meta property="og:url" content="https://tuinwijzer.netlify.app/" />
    <meta property="og:type" content="website" />

  <body>
    <div id="root" data-page="home"></div>
    <!-- Voor Netlify Forms: zo herkent Netlify het formulier bij de build. Het echte formulier staat in de app. -->
    <form name="plant-suggestie" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="plant" />
      <textarea name="toelichting"></textarea>
      <input name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
